# Newzort Ask AI — Cloudflare Worker
# Deploy:   cd worker && npx wrangler deploy
# Secrets (typed in YOUR terminal, never committed):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GROQ_API_KEY      (optional fallback)

name = "newzort-ask"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
FEED_URL = "https://thashikr.github.io/Newzort/feed.json"

# Abuse protection: one Durable Object per IP counts questions exactly
# (6/minute, 60/day — see AskRateLimiter in src/index.ts).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "AskRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AskRateLimiter"]
